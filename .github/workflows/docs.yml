name: Documentación

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Instalar dependencias de documentación
        run: python -m pip install -r requirements-docs.txt

      - name: Generar referencia Kotlin con Dokka
        run: |
          ./gradlew -I docs/dokka-init.gradle :app:dokkaGeneratePublicationHtml
          test -s app/build/dokka/html/index.html
          mkdir -p docs/referencia/api-kotlin
          cp -R app/build/dokka/html/. docs/referencia/api-kotlin/

      - name: Validar documentación
        run: mkdocs build --strict

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Instalar dependencias de documentación
        run: python -m pip install -r requirements-docs.txt

      - name: Generar referencia Kotlin con Dokka
        run: |
          ./gradlew -I docs/dokka-init.gradle :app:dokkaGeneratePublicationHtml
          test -s app/build/dokka/html/index.html
          mkdir -p docs/referencia/api-kotlin
          cp -R app/build/dokka/html/. docs/referencia/api-kotlin/

      - name: Publicar en GitHub Pages
        run: mkdocs gh-deploy --strict --force

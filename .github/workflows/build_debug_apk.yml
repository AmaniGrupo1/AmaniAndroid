name: 🛠️ Build Debug APK

on:
  # Se ejecuta al hacer push en las ramas principales
  push:
    branches:
      - master
      - main
      - develop

  # Se ejecuta en pull requests hacia las ramas principales
  pull_request:
    branches:
      - master
      - main
      - develop

  # Permite ejecutarlo manualmente desde la pestaña "Actions" en GitHub
  workflow_dispatch:
    inputs:
      branch:
        description: 'Rama a compilar'
        required: false
        default: 'develop'

jobs:
  build-debug-apk:
    name: 📦 Compilar APK de Debug
    runs-on: ubuntu-latest

    steps:
      # 1. Clonar el repositorio
      - name: 📥 Checkout del código
        uses: actions/checkout@v4

      # 2. Configurar JDK 17 (requerido por el proyecto)
      - name: ☕ Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. Configurar el Android SDK
      - name: 🤖 Configurar Android SDK
        uses: android-actions/setup-android@v3

      # 4. Cache de Gradle para acelerar builds futuras
      - name: 📦 Cache de dependencias Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 5. Dar permisos de ejecución al wrapper de Gradle
      - name: 🔐 Permisos para gradlew
        run: chmod +x ./gradlew

      # 6. Crear el archivo google-services.json desde el secreto de GitHub
      #    Falla explícitamente si el secreto no existe para evitar errores silenciosos
      - name: 🔥 Configurar google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error title=Secreto faltante::El secreto GOOGLE_SERVICES_JSON no está configurado. Es obligatorio para Firebase."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON" > app/google-services.json

      # 7. Autenticar con GCP usando la Service Account almacenada en GitHub Secrets
      - name: 🔑 Autenticar en Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # 8. Leer STRIPE_PUBLISHABLE_KEY desde GCP Secret Manager e inyectarla en local.properties
      #    Gradle la leerá automáticamente y la expondrá como BuildConfig.STRIPE_PUBLISHABLE_KEY
      - name: 💳 Obtener clave pública de Stripe desde Secret Manager
        run: |
          STRIPE_KEY=$(gcloud secrets versions access latest \
            --secret="STRIPE_PUBLISHABLE_KEY" \
            --project="amani-160bf")
          if [ -z "$STRIPE_KEY" ]; then
            echo "::error title=Secreto faltante::No se pudo leer STRIPE_PUBLISHABLE_KEY desde Secret Manager."
            exit 1
          fi
          echo "STRIPE_PUBLISHABLE_KEY=$STRIPE_KEY" >> local.properties
          echo "✅ Clave pública de Stripe inyectada en local.properties"

      # 9. Compilar el APK de Debug
      - name: 🔨 Compilar APK de Debug
        run: ./gradlew assembleDebug --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Xmx4g -Dorg.gradle.parallel=false"

      # 10. Renombrar el APK con el nombre de rama y número de build para identificarlo fácilmente
      - name: 🏷️ Renombrar APK
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          BRANCH_SAFE=$(echo "$BRANCH_NAME" | tr '/' '-')
          BUILD_NUMBER="${{ github.run_number }}"
          DATE=$(date +'%Y%m%d-%H%M')
          APK_NAME="amani-debug-${BRANCH_SAFE}-build${BUILD_NUMBER}-${DATE}.apk"
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/$APK_NAME
          echo "APK_NAME=$APK_NAME" >> $GITHUB_ENV
          echo "✅ APK renombrado a: $APK_NAME"

      # 11. Subir el APK como artefacto de GitHub Actions (descargable por 7 días)
      - name: 📤 Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: app/build/outputs/apk/debug/${{ env.APK_NAME }}
          retention-days: 7
          if-no-files-found: error

      # 12. Mostrar resumen del build en el panel de GitHub Actions
      - name: 📊 Resumen del build
        if: always()
        run: |
          echo "## 🛠️ Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **APK** | \`${{ env.APK_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Rama** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Build #** | \`${{ github.run_number }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📱 Instalación" >> $GITHUB_STEP_SUMMARY
          echo "Descarga el APK desde la sección **Artifacts** de este workflow y transfierelo a tu dispositivo Android." >> $GITHUB_STEP_SUMMARY
          echo "Asegúrate de tener **'Fuentes desconocidas'** o **'Instalar apps desconocidas'** habilitado en tu dispositivo." >> $GITHUB_STEP_SUMMARY

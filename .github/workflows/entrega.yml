name: Entrega

# Documentación (Dokka + MkDocs) y publicación del APK firmado.
#  - Pull request o push a master: valida la documentación (y la publica en GitHub Pages en master).
#  - Etiqueta v*: compila y publica el APK firmado en GitHub Releases.
on:
  pull_request:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Etiqueta existente a publicar como release (vacío = solo documentación)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  docs:
    name: Documentación
    if: ${{ !startsWith(github.ref, 'refs/tags/') && inputs.tag == '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh-deploy en master; en PR no se usa
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Instalar dependencias de documentación
        run: python -m pip install -r requirements-docs.txt

      - name: Generar referencia Kotlin con Dokka
        run: |
          chmod +x gradlew
          ./gradlew -I docs/dokka-init.gradle :app:dokkaGeneratePublicationHtml
          test -s app/build/dokka/html/index.html
          mkdir -p docs/referencia/api-kotlin
          cp -R app/build/dokka/html/. docs/referencia/api-kotlin/

      - name: Validar documentación
        run: mkdocs build --strict

      - name: Publicar en GitHub Pages
        if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: mkdocs gh-deploy --strict --force

  release:
    name: APK firmado
    if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.tag != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Aceptar licencias del Android SDK
        run: yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - run: chmod +x gradlew

      - name: Configurar Firebase
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error title=Secreto faltante::GOOGLE_SERVICES_JSON es obligatorio."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Configurar clave de firma
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEYSTORE_ALIAS: ${{ secrets.RELEASE_KEYSTORE_ALIAS }}
        run: |
          for v in ANDROID_KEYSTORE_BASE64 RELEASE_KEYSTORE_PASSWORD RELEASE_KEYSTORE_ALIAS; do
            if [ -z "${!v}" ]; then
              echo "::error title=Secreto faltante::$v es obligatorio."
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.keystore
          chmod 600 release.keystore
          {
            echo "RELEASE_KEYSTORE_FILE=release.keystore"
            echo "RELEASE_KEYSTORE_PASSWORD=$RELEASE_KEYSTORE_PASSWORD"
            echo "RELEASE_KEYSTORE_ALIAS=$RELEASE_KEYSTORE_ALIAS"
          } > local.properties

      - name: Compilar APK de release firmado
        run: ./gradlew assembleRelease --stacktrace

      - name: Preparar asset
        id: asset
        run: |
          APK_NAME="amani-${TAG#v}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK_NAME"
          echo "name=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Publicar GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          APK_NAME: ${{ steps.asset.outputs.name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_NAME" --clobber
          else
            gh release create "$TAG" "$APK_NAME" --title "Amani $TAG" --generate-notes
          fi

      - name: Resumen
        if: always()
        env:
          APK_NAME: ${{ steps.asset.outputs.name }}
        run: |
          {
            echo "## APK firmado"
            echo "| Campo | Valor |"
            echo "|---|---|"
            echo "| Tag | \`$TAG\` |"
            echo "| APK | \`$APK_NAME\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

name: CI

# Verificación de cada cambio: tests unitarios, compilación de los APK de debug y de
# instrumentación, y pruebas en Firebase Test Lab sobre esos mismos APK.
on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Xmx4g -Dorg.gradle.parallel=false"

jobs:
  build:
    name: Tests unitarios y APK de debug
    runs-on: ubuntu-latest
    env:
      HAS_GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}
      HAS_GCP: ${{ secrets.GCP_SA_KEY != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      # El runner ubuntu-latest ya trae el Android SDK (ANDROID_HOME). El paso
      # android-actions/setup-android@v3 fallaba en sdkmanager ("Failed to find package 'tools'")
      # antes de compilar, así que se elimina y solo se aceptan las licencias.
      - name: Aceptar licencias del Android SDK
        run: yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Permisos para gradlew
        run: chmod +x gradlew

      # Si el secreto no existe (p. ej. PR desde un fork) se usa el google-services.json versionado.
      - name: Configurar google-services.json
        if: env.HAS_GOOGLE_SERVICES == 'true'
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Autenticar en Google Cloud
        if: env.HAS_GCP == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # La clave solo alimenta BuildConfig.STRIPE_PUBLISHABLE_KEY (vacía por defecto en
      # app/build.gradle.kts), así que no es necesaria para tests ni compilación. Si la cuenta de
      # servicio no tiene secretmanager.versions.access se avisa, pero no se bloquea el CI.
      - name: Obtener clave pública de Stripe desde Secret Manager
        if: env.HAS_GCP == 'true'
        run: |
          if STRIPE_KEY=$(gcloud secrets versions access latest \
              --secret="STRIPE_PUBLISHABLE_KEY" --project="amani-160bf" 2>/tmp/stripe.err) \
              && [ -n "$STRIPE_KEY" ]; then
            echo "STRIPE_PUBLISHABLE_KEY=$STRIPE_KEY" >> local.properties
          else
            echo "::warning title=Stripe::No se pudo leer STRIPE_PUBLISHABLE_KEY (¿falta el rol Secret Manager Secret Accessor en la cuenta de servicio?). Se compila con la clave vacía."
            head -c 300 /tmp/stripe.err || true
          fi

      - name: Tests unitarios
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Subir informes de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes-tests-unitarios
          path: app/build/reports/tests/testDebugUnitTest
          retention-days: 7
          if-no-files-found: ignore

      - name: Compilar APK de debug y de instrumentación
        run: ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace

      - name: Subir APK de debug
        uses: actions/upload-artifact@v4
        with:
          name: amani-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error

      - name: Subir APK de instrumentación
        uses: actions/upload-artifact@v4
        with:
          name: amani-androidtest-${{ github.run_number }}
          path: app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          retention-days: 7
          if-no-files-found: error

      - name: Resumen
        if: always()
        run: |
          {
            echo "## Resumen de CI"
            echo "| Campo | Valor |"
            echo "|---|---|"
            echo "| Rama | \`${{ github.head_ref || github.ref_name }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Build | \`${{ github.run_number }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  test-lab:
    name: Firebase Test Lab
    needs: build
    # Los PR desde forks no tienen acceso a los secretos de Google Cloud.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Descargar APK de debug
        uses: actions/download-artifact@v4
        with:
          name: amani-debug-${{ github.run_number }}
          path: apk

      - name: Descargar APK de instrumentación
        uses: actions/download-artifact@v4
        with:
          name: amani-androidtest-${{ github.run_number }}
          path: apk

      - name: Autenticar en Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Robo test
        run: |
          gcloud firebase test android run \
            --type robo \
            --app apk/app-debug.apk \
            --device model=panther,version=33,locale=es,orientation=portrait \
            --timeout 5m \
            --project ${{ secrets.GCP_PROJECT_ID }}

      - name: Tests de instrumentación
        run: |
          gcloud firebase test android run \
            --type instrumentation \
            --app apk/app-debug.apk \
            --test apk/app-debug-androidTest.apk \
            --device model=panther,version=33,locale=es,orientation=portrait \
            --timeout 10m \
            --project ${{ secrets.GCP_PROJECT_ID }}

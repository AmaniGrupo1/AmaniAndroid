name: Release Signed APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Etiqueta existente que se publicará (por ejemplo, v2.4.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Gradle wrapper permission
        run: chmod +x gradlew

      - name: Configure Firebase
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error title=Missing secret::GOOGLE_SERVICES_JSON must be configured."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Configure signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEYSTORE_ALIAS: ${{ secrets.RELEASE_KEYSTORE_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error title=Missing secret::ANDROID_KEYSTORE_BASE64 must be configured."
            exit 1
          fi
          if [ -z "$RELEASE_KEYSTORE_PASSWORD" ]; then
            echo "::error title=Missing secret::RELEASE_KEYSTORE_PASSWORD must be configured."
            exit 1
          fi
          if [ -z "$RELEASE_KEYSTORE_ALIAS" ]; then
            echo "::error title=Missing secret::RELEASE_KEYSTORE_ALIAS must be configured."
            exit 1
          fi

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.keystore
          chmod 600 release.keystore
          {
            echo "RELEASE_KEYSTORE_FILE=release.keystore"
            echo "RELEASE_KEYSTORE_PASSWORD=$RELEASE_KEYSTORE_PASSWORD"
            echo "RELEASE_KEYSTORE_ALIAS=$RELEASE_KEYSTORE_ALIAS"
          } > local.properties

      - name: Build signed release APK
        run: ./gradlew assembleRelease --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Xmx4g -Dorg.gradle.parallel=false"

      - name: Prepare release asset
        id: asset
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          APK_NAME="amani-${TAG#v}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK_NAME"
          echo "name=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          APK_NAME: ${{ steps.asset.outputs.name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_NAME" --clobber
          else
            gh release create "$TAG" "$APK_NAME" \
              --title "Amani $TAG" \
              --generate-notes
          fi

      - name: Write summary
        if: always()
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          APK_NAME: ${{ steps.asset.outputs.name }}
        run: |
          {
            echo "## Signed APK release"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Tag | \`$TAG\` |"
            echo "| APK | \`$APK_NAME\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
